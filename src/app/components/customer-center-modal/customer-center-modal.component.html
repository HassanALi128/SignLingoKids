<ion-header class="ion-no-border">
    <ion-toolbar color="transparent">
        <ion-buttons slot="start">
            <ion-button (click)="close()" fill="clear">
                <ion-icon name="close" slot="icon-only" style="color: black; font-size: 28px;"></ion-icon>
            </ion-button>
        </ion-buttons>
    </ion-toolbar>
</ion-header>

<ion-content class="customer-center-content">
    <div class="customer-center-container">
        <!-- Header Section with Gradient -->
        <div class="header-section">
            <h2>Manage Subscription</h2>
            <p>View and manage your premium subscription</p>
        </div>

        <!-- Info Section -->
        <div class="info-section">
            <p>
                <ion-icon name="information-circle"></ion-icon>
                You can manage your subscription, change plans, or cancel anytime from the subscription center.
            </p>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
            <ion-button expand="block" (click)="presentCustomerCenter()" [disabled]="isLoading">
                <ion-icon slot="start" name="settings"></ion-icon>
                Open Subscription Center
            </ion-button>

            <ion-button expand="block" fill="outline" (click)="restorePurchases()" [disabled]="isLoading">
                <ion-icon slot="start" name="refresh"></ion-icon>
                Restore Purchases
            </ion-button>
        </div>

        <!-- Loading Spinner -->
        <div *ngIf="isLoading" class="loading-overlay">
            <ion-spinner name="crescent"></ion-spinner>
            <p>Loading...</p>
        </div>
    </div>
</ion-content>
