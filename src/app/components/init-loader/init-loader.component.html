<div class="init-loader-overlay" *ngIf="show">
    <div class="init-loader-content">
        <!-- Simple Spinner -->
        <div class="spinner-container">
            <ion-spinner name="crescent" color="primary"></ion-spinner>
        </div>

        <!-- Status Message -->
        <div class="status-message">
            <p class="status-text">{{ status }}</p>
        </div>
    </div>
</div>
