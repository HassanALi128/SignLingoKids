<div class="init-loader-overlay" *ngIf="show">
    <div class="init-loader-content">
        <!-- Logo -->
        <div class="logo-container">
            <img src="assets/logo.png" alt="SignLingo Kids" class="app-logo bounce" />
        </div>

        <!-- Animated Stars -->
        <div class="stars-container">
            <div class="star star-1">⭐</div>
            <div class="star star-2">⭐</div>
            <div class="star star-3">⭐</div>
            <div class="star star-4">✨</div>
            <div class="star star-5">✨</div>
        </div>

        <!-- Loading Spinner -->
        <div class="spinner-container">
            <ion-spinner name="circular" color="primary"></ion-spinner>
        </div>

        <!-- Status Message -->
        <div class="status-message">
            <p class="status-text">{{ status }}</p>
        </div>

        <!-- Friendly Message -->
        <div class="friendly-message">
            <p class="message-text">🎉 Getting everything ready for you!</p>
        </div>
    </div>
</div>
