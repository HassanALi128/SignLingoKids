<ion-app>
  <!-- Offline Mode Banner -->
  <!-- Uses async pipe — no subscription/teardown needed in the component class. -->
  @if ((isOnline$ | async) === false) {
  <div class="offline-banner" role="status" aria-live="polite">
    <span class="offline-icon">📡</span>
    <span>Offline Mode — Progress will sync when reconnected</span>
  </div>
  }

  <app-init-loader
    [show]="showInitLoader"
    [status]="initStatus"
  ></app-init-loader>
  <ion-router-outlet [swipeGesture]="true"></ion-router-outlet>
</ion-app>
