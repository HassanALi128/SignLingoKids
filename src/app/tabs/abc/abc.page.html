<ion-header>
  <ion-toolbar>
    <div class="header-content">
      <div class="greeting">
        <h2>Hello, {{userName}}!</h2>
        <p>Let's Start ABC's Learning!</p>
      </div>
      @if(userAvatar){
      <div class="user-avatar">
        <ion-img [src]="userAvatar" class="avatar-img"></ion-img>
      </div>
      }
    </div>
  </ion-toolbar>
</ion-header>

<ion-content class="abc-content">
  <!-- Main Hand Sign Display -->
  <div class="main-display">
    <div class="hand-sign-container">
      <img [src]="currentLetter.handSignUrl" [alt]="currentLetter.letter + ' sign'" class="main-hand-sign">
    </div>

    <!-- Graduation Cap Button -->
    <button class="graduation-btn" (click)="markCurrentAsLearned()">
      <ion-icon name="school"></ion-icon>
    </button>
  </div>

  <!-- ABC Letters Grid -->
  <div class="letters-section">
    <div class="letters-grid">
      <div *ngFor="let letter of letters; let i = index" class="letter-card"
        [class.active]="currentLetter.id === letter.id" [class.learned]="isLetterLearned(letter.id)"
        (click)="selectLetter(letter)">

        <!-- Letter Image -->
        <!-- <div class="letter-image">
          <img [src]="letter.handSignUrl" [alt]="letter.letter">
        </div> -->

        <!-- Letter Label -->
        <div class="letter-label">
          <img [src]="letter.letter" [alt]="letter.id">
        </div>
      </div>
    </div>
  </div>
</ion-content>
